[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-graphrag-agent"
version = "0.2.0"
description = "Tenant-scoped hybrid GraphRAG runtime with FAISS, Neo4j, vLLM and MCP"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["enterprise_graphrag/tests"]
