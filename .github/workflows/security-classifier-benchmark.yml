name: GraphRAG Semantic Injection Classifier Evaluation

on:
  push:
    branches:
      - security/semantic-injection-gate-2026-10-11
    paths:
      - "scripts/run_real_benchmarks.py"
      - ".github/workflows/security-classifier-benchmark.yml"
      - "enterprise_graphrag/security.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphrag-semantic-classifier-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classifier-benchmark:
    name: Balanced injection / benign classifier benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
      GRAGRAPH_MAX_SECURITY_SAMPLES: "200"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project, data loader, embedding dependency and Transformers
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-enterprise.txt
          python -m pip install "datasets==3.6.0" "sentence-transformers==4.1.0" "transformers>=4.48,<5"
          python -m pip check
      - name: Compile and run regression tests
        run: |
          python -m compileall -q enterprise_graphrag scripts
          pytest -q enterprise_graphrag/tests -m "not integration and not gpu"
      - name: Download the licensed evaluation config and classifier, then score
        run: |
          python scripts/run_real_benchmarks.py \
            --skip-retrieval \
            --max-security-samples "$GRAGRAPH_MAX_SECURITY_SAMPLES" \
            --output-dir artifacts/security-classifier \
            --cache-dir "$HOME/.cache/graphrag-security-eval"
      - name: Upload security evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphrag-semantic-classifier-${{ github.run_id }}
          path: artifacts/security-classifier/
          if-no-files-found: warn
