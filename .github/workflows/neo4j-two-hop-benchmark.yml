name: Neo4j Two-Hop Retrieval Ablation

on:
  push:
    branches:
      - eval/neo4j-two-hop-2026-10-12
    paths:
      - ".github/workflows/neo4j-two-hop-benchmark.yml"
      - "enterprise_graphrag/neo4j_store.py"
      - "enterprise_graphrag/tests/test_neo4j_integration.py"
      - "scripts/run_real_benchmarks.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphrag-neo4j-two-hop-ablation
  cancel-in-progress: false

jobs:
  neo4j-two-hop-benchmark:
    name: Live Neo4j two-hop + BGE SciFact benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      neo4j:
        image: neo4j:2026-community
        env:
          NEO4J_AUTH: neo4j/benchmark-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: benchmark-password
      NEO4J_DATABASE: neo4j
      GRAGRAPH_EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
      GRAGRAPH_EMBED_BATCH_SIZE: "128"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and benchmark dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-enterprise.txt
          python -m pip install "datasets==3.6.0" "sentence-transformers==4.1.0"
          python -m pip check

      - name: Compile and run regression plus live Neo4j isolation tests
        run: |
          set -euo pipefail
          python -m compileall -q enterprise_graphrag scripts
          pytest -q enterprise_graphrag/tests -m "not integration and not gpu"
          pytest -q enterprise_graphrag/tests/test_neo4j_integration.py -m integration

      - name: Benchmark BGE vector, memory graph, real Neo4j and RRF
        run: |
          set -euo pipefail
          python scripts/run_real_benchmarks.py \
            --output-dir artifacts/neo4j-two-hop \
            --cache-dir "$HOME/.cache/graphrag-eval" \
            --embedding-model BAAI/bge-base-en-v1.5 \
            --max-beir-queries 150 \
            --max-security-samples 0 \
            --skip-security \
            --seed 20261012

      - name: Upload retrieval metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphrag-neo4j-two-hop-${{ github.run_id }}
          path: artifacts/neo4j-two-hop/
          if-no-files-found: warn
