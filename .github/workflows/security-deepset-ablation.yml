name: GraphRAG DeBERTa Injection Detector External Evaluation

on:
  push:
    branches:
      - security/deepset-ablation-2026-10-12
    paths:
      - ".github/workflows/security-deepset-ablation.yml"
      - "scripts/evaluate_injection_ood.py"
      - "enterprise_graphrag/security.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphrag-deepset-injection-ablation
  cancel-in-progress: true

jobs:
  evaluate-deepset:
    name: Deepset DeBERTa — BIPIA / PIArena / benign hard negatives
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and evaluation dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-enterprise.txt
          python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "datasets==3.6.0" "transformers>=4.48,<5" "sentencepiece>=0.2,<1"
          python -m pip check
      - name: Compile and run security regression tests
        run: |
          python -m compileall -q enterprise_graphrag scripts
          pytest -q enterprise_graphrag/tests -m "not integration and not gpu"
      - name: Score MIT DeBERTa on independent injection data and benign hard negatives
        run: |
          python scripts/evaluate_injection_ood.py \
            --output-dir artifacts/deepset-injection-evaluation \
            --cache-dir "$HOME/.cache/graphrag-deepset-evaluation" \
            --model "deepset/deberta-v3-base-injection" \
            --configs "synthetic_v2_test,bipia,piarena,notinject,orbench_hard" \
            --max-per-class 100 \
            --max-length 512 \
            --window-overlap 64 \
            --seed 20261012
      - name: Upload classifier metrics and dataset license details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepset-injection-evaluation-${{ github.run_id }}
          path: artifacts/deepset-injection-evaluation/
          if-no-files-found: warn
