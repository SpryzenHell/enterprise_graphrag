name: enterprise-graphrag

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enterprise.txt
      - name: Compile
        run: python -m compileall enterprise_graphrag scripts
      - name: Tests
        run: pytest -q enterprise_graphrag/tests
      - name: Evaluation
        run: python scripts/evaluate_enterprise.py
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-graphrag-evaluation
          path: enterprise_data/evaluation.json
