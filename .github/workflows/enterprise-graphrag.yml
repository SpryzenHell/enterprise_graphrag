name: enterprise-graphrag

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enterprise.txt
          python -m pip check

      - name: Compile
        run: python -m compileall enterprise_graphrag scripts

      - name: Tests
        run: pytest -q enterprise_graphrag/tests -m "not integration"

      - name: Deterministic security evaluation
        run: python scripts/evaluate_enterprise.py

      - name: Retrieval benchmark
        run: python scripts/benchmark_retrieval.py

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-graphrag-evidence
          path: |
            enterprise_data/evaluation.json
            enterprise_data/benchmark.json

  neo4j-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-enterprise.txt

      - name: Neo4j tenant integration
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          NEO4J_DATABASE: neo4j
        run: pytest -q enterprise_graphrag/tests/test_neo4j_integration.py -m integration


  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          GRAGRAPH_JWT_SECRET: ci-only-secret-change-me-please-32-bytes
          NEO4J_PASSWORD: testpassword
        run: docker compose -f docker-compose.enterprise.yml config

      - name: Build production image
        run: docker build -f Dockerfile.enterprise -t enterprise-graphrag:ci .

      - name: Start container
        run: |
          docker run -d --name enterprise-graphrag-ci \
            -p 8000:8000 \
            -e GRAGRAPH_ENV=production \
            -e GRAGRAPH_JWT_SECRET=ci-only-secret-change-me-please-32-bytes \
            -e GRAGRAPH_JWT_ISSUER=https://graphrag.example.invalid \
            -e GRAGRAPH_JWT_AUDIENCE=enterprise-graphrag-api \
            -e MCP_RESOURCE_URL=https://graphrag.example.invalid/mcp/ \
            -e MCP_ISSUER_URL=https://graphrag.example.invalid \
            -e MCP_ALLOWED_HOSTS=graphrag.example.invalid:*,localhost:8000 \
            -e MCP_ALLOWED_ORIGINS=https://graphrag.example.invalid \
            enterprise-graphrag:ci

      - name: Health and readiness smoke test
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          docker exec enterprise-graphrag-ci python scripts/build_demo_index.py
          TOKEN=$(docker exec enterprise-graphrag-ci python -c 'import os,jwt; print(jwt.encode({"sub":"ci-user","tenant_id":"acme","scope":"graphrag:query","iss":os.environ["GRAGRAPH_JWT_ISSUER"],"aud":os.environ["GRAGRAPH_JWT_AUDIENCE"]}, os.environ["GRAGRAPH_JWT_SECRET"], algorithm="HS256"))')
          docker exec enterprise-graphrag-ci python scripts/runtime_probe.py \
            --base-url http://127.0.0.1:8000 \
            --token "${TOKEN}" \
            --tenant acme \
            --query "incident records" \
            --expected-doc-id acme-retention
          docker exec enterprise-graphrag-ci python scripts/mcp_probe.py \
            --url http://127.0.0.1:8000/mcp/ \
            --token "${TOKEN}" \
            --tenant acme \
            --query "incident records" \
            --expected-doc-id acme-retention

      - name: Container logs on failure
        if: failure()
        run: docker logs enterprise-graphrag-ci

      - name: Stop container
        if: always()
        run: docker rm -f enterprise-graphrag-ci


  compose-smoke:
    runs-on: ubuntu-latest
    env:
      GRAGRAPH_ENV: production
      GRAGRAPH_JWT_SECRET: ci-only-secret-change-me-please-32-bytes
      GRAGRAPH_JWT_ISSUER: https://graphrag.example.invalid,http://localhost:8000
      GRAGRAPH_JWT_AUDIENCE: enterprise-graphrag-api
      NEO4J_PASSWORD: testpassword
      MCP_RESOURCE_URL: https://graphrag.example.invalid/mcp/
      MCP_ISSUER_URL: https://graphrag.example.invalid,http://localhost:8000
      MCP_ALLOWED_HOSTS: graphrag.example.invalid:*,localhost:8000
      MCP_ALLOWED_ORIGINS: https://graphrag.example.invalid,http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose -f docker-compose.enterprise.yml up -d --build

      - name: Wait for full-stack readiness
        run: |
          for i in $(seq 1 45); do
            if docker compose -f docker-compose.enterprise.yml exec -T app               python scripts/runtime_probe.py --base-url http://localhost:8000; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.enterprise.yml ps
          exit 1

      - name: Authenticated full-stack query
        run: |
          docker compose -f docker-compose.enterprise.yml exec -T app             python scripts/build_demo_index.py
          TOKEN=$(docker compose -f docker-compose.enterprise.yml exec -T app             python -c 'import os,jwt; print(jwt.encode({"sub":"ci-user","tenant_id":"acme","scope":"graphrag:query","iss":os.environ["GRAGRAPH_JWT_ISSUER"],"aud":os.environ["GRAGRAPH_JWT_AUDIENCE"]}, os.environ["GRAGRAPH_JWT_SECRET"], algorithm="HS256"))')
          docker compose -f docker-compose.enterprise.yml exec -T app             python scripts/runtime_probe.py \
              --base-url http://localhost:8000 \
              --token "${TOKEN}" \
              --tenant acme \
              --query "incident records" \
              --expected-doc-id acme-retention
          docker compose -f docker-compose.enterprise.yml exec -T app             python scripts/mcp_probe.py \
              --url http://localhost:8000/mcp/ \
              --token "${TOKEN}" \
              --tenant acme \
              --query "incident records" \
              --expected-doc-id acme-retention

      - name: Full-stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.enterprise.yml logs --no-color

      - name: Full-stack status on failure
        if: failure()
        run: docker compose -f docker-compose.enterprise.yml ps

      - name: Stop full stack
        if: always()
        run: docker compose -f docker-compose.enterprise.yml down -v
