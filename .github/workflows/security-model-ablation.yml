name: GraphRAG Security Classifier Ablation

on:
  push:
    branches:
      - security/semantic-injection-gate-2026-10-11
    paths:
      - ".github/workflows/security-model-ablation.yml"
      - "enterprise_graphrag/security.py"
      - "scripts/evaluate_injection_ood.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphrag-security-model-ablation-${{ github.ref }}-${{ matrix.key }}
  cancel-in-progress: true

jobs:
  classifier-ablation:
    name: ${{ matrix.key }} — indirect injection + benign hard negatives
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: horizon-small
            model: Horizon-Labs/prompt-injection-guard-small
            max_length: 1024
            window_overlap: 128
          - key: protectai-deberta-v3
            model: protectai/deberta-v3-base-prompt-injection-v2
            max_length: 512
            window_overlap: 64
          - key: horizon-base
            model: Horizon-Labs/prompt-injection-guard-base
            max_length: 8192
            window_overlap: 512
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project, external dataset and classifier libraries
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-enterprise.txt
          python -m pip install "datasets==3.6.0" "transformers>=4.48,<5" "sentencepiece>=0.2,<1"
          python -m pip check

      - name: Compile and run security regression tests
        run: |
          python -m compileall -q enterprise_graphrag scripts
          pytest -q enterprise_graphrag/tests -m "not integration and not gpu"

      - name: Measure detector quality with fixed samples
        run: |
          python scripts/evaluate_injection_ood.py \
            --output-dir "artifacts/security-ablation/${{ matrix.key }}" \
            --cache-dir "$HOME/.cache/graphrag-security-ablation" \
            --model "${{ matrix.model }}" \
            --configs "synthetic_v2_test,bipia,piarena,notinject,orbench_hard" \
            --max-per-class 50 \
            --max-length "${{ matrix.max_length }}" \
            --window-overlap "${{ matrix.window_overlap }}" \
            --seed 20261012

      - name: Upload model comparison metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-ablation-${{ matrix.key }}-${{ github.run_id }}
          path: "artifacts/security-ablation/${{ matrix.key }}/"
          if-no-files-found: warn
