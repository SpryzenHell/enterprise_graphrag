name: GraphRAG HotpotQA Entity-Alias Ablation (120-query fast pass)

on:
  push:
    branches:
      - eval/hotpotqa-entity-aliases-2026-10-15
    paths:
      - ".github/workflows/hotpotqa-entity-aliases.yml"
      - "enterprise_graphrag/neo4j_store.py"
      - "enterprise_graphrag/tests/test_entity_extraction.py"
      - "scripts/evaluate_hotpotqa_rrf.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotpotqa-entity-aliases-${{ github.ref }}
  cancel-in-progress: false

jobs:
  multihop-evaluation:
    name: HotpotQA supporting-fact retrieval with live Neo4j
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      neo4j:
        image: neo4j:2026-community
        env:
          NEO4J_AUTH: neo4j/benchmark-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEO4J_URI: "bolt://localhost:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "benchmark-password"
      NEO4J_DATABASE: "neo4j"
      GRAGRAPH_EMBED_BATCH_SIZE: "128"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_VERBOSITY: error
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and licensed dataset/model packages
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-enterprise.txt
          python -m pip install "datasets==3.6.0" "sentence-transformers==4.1.0"
          python -m pip check
      - name: Compile project and run regression tests
        run: |
          python -m compileall -q enterprise_graphrag scripts
          pytest -q enterprise_graphrag/tests -m "not integration and not gpu"
          pytest -q enterprise_graphrag/tests/test_entity_extraction.py
      - name: Run live Neo4j tenant and two-hop regressions
        run: |
          pytest -q enterprise_graphrag/tests/test_neo4j_integration.py -m integration
      - name: Evaluate multi-hop supporting evidence and RRF
        run: |
          python scripts/evaluate_hotpotqa_rrf.py \
            --output-dir artifacts/hotpotqa-entity-aliases \
            --cache-dir "$HOME/.cache/hotpotqa-entity-aliases" \
            --max-queries 120 \
            --embedding-batch-size 128 \
            --seed 20261015
      - name: Upload aggregate results and dataset license notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotpotqa-entity-aliases-${{ github.run_id }}
          path: artifacts/hotpotqa-entity-aliases/
          if-no-files-found: warn
