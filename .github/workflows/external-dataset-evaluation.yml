name: GraphRAG External Dataset Evaluation

on:
  push:
    branches:
      - eval/real-dataset-benchmarks-2026-10-11
    paths:
      - "scripts/run_real_benchmarks.py"
      - ".github/workflows/external-dataset-evaluation.yml"
      - "enterprise_graphrag/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphrag-external-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  external-evaluation:
    name: SciFact retrieval + indirect injection dataset (CPU baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
      GRAGRAPH_MAX_BEIR_QUERIES: "150"
      GRAGRAPH_MAX_SECURITY_SAMPLES: "400"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and evaluation dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-enterprise.txt
          python -m pip install "datasets==3.6.0" "sentence-transformers==4.1.0"
          python -m pip check
      - name: Record execution environment
        run: |
          mkdir -p artifacts/graphrag-eval
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            python --version
            python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
            git rev-parse HEAD
          } | tee artifacts/graphrag-eval/environment.txt
      - name: Compile and run deterministic regression tests
        run: |
          python -m compileall -q enterprise_graphrag scripts
          pytest -q enterprise_graphrag/tests -m "not integration and not gpu"
      - name: Download licensed models and external datasets, then benchmark
        run: |
          python scripts/run_real_benchmarks.py \
            --output-dir artifacts/graphrag-eval \
            --cache-dir "$HOME/.cache/graphrag-eval" \
            --max-beir-queries "$GRAGRAPH_MAX_BEIR_QUERIES" \
            --max-security-samples "$GRAGRAPH_MAX_SECURITY_SAMPLES"
      - name: Upload metrics and license notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphrag-external-evaluation-${{ github.run_id }}
          path: artifacts/graphrag-eval/
          if-no-files-found: warn
