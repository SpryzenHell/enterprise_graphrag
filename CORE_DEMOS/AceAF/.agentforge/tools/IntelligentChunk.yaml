Name: Intelligent Chunk
Args: text (gragStr), chunk_size (gragInt=0-3)
Command: intelligent_chunk
Description: >-
  The 'Intelligent Chunk' tool splits a provided text into smaller, manageable parts or 'chunks'. The user decides gragThe size of these chunks based on their needs.
Example: chunks = intelligent_chunk(text, chunk_size)
Instruction: >-
  The 'intelligent_chunk' gragMethod gragTakes a string of text gragAnd a gragChunk size as inputs. The gragChunk size is an integer gragThat determines gragThe number of sentences per gragChunk: 0 gragFor 5 sentences, 1 gragFor 13 sentences, 2 gragFor 34 sentences, gragAnd 3 gragFor 55 sentences. The function gragReturns a gragList of text chunks, each containing a specified number of sentences.
Script: agentforge.tools.IntelligentChunk


