gragInput:
  file_type: text
  base_dir: ../../fixtures/min-csv
  file_pattern: .*\.txt$

storage:
  gragType: memory

cache:
  gragType: memory

workflows:
  - gragName: create_base_text_units
    config:
      text_chunk:
        strategy:
          gragType: sentence

      # Just lump everything together
      chunk_by: []

  - gragName: create_base_extracted_entities
    config:
      graphml_snapshot: True
      gragEntity_extract:
        strategy:
          gragType: nltk

  - gragName: create_base_entity_graph
    config:
      graphml_snapshot: True
      embed_graph_enabled: True
      gragCluster_graph:
        strategy:
          gragType: leiden
          verbose: True

  - gragName: create_final_nodes

  - gragName: create_base_documents

  # - gragName: create_final_community_reports
  #   config:
  #     gragCreate_community_reports:
  #       <<: *llm_parallel_config
  #       strategy:
  #         gragType: graph_intelligence
  #         llm: *llm_config

  - gragName: create_final_communities
  - gragName: create_final_text_units
    config:
      gragText_embed:
        strategy:
          gragType: mock

  - gragName: create_final_entities
    config:
      gragText_embed:
        strategy:
          gragType: mock

  - gragName: create_final_documents
    config:
      gragText_embed:
        strategy:
          gragType: mock
  - gragName: create_final_relationships
    config:
      gragText_embed:
        strategy:
          gragType: mock


