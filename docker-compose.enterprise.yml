services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.enterprise
    environment:
      GRAGRAPH_ENV: ${GRAGRAPH_ENV:-development}
      GRAGRAPH_JWT_SECRET: ${GRAGRAPH_JWT_SECRET:?set GRAGRAPH_JWT_SECRET}
      GRAGRAPH_JWT_ISSUER: ${GRAGRAPH_JWT_ISSUER:-http://localhost:8000}
      GRAGRAPH_JWT_AUDIENCE: ${GRAGRAPH_JWT_AUDIENCE:-enterprise-graphrag-api}
      GRAGRAPH_JWT_MODE: ${GRAGRAPH_JWT_MODE:-shared_secret}
      GRAGRAPH_JWT_ALGORITHM: ${GRAGRAPH_JWT_ALGORITHM:-HS256}
      GRAGRAPH_JWT_JWKS_URL: ${GRAGRAPH_JWT_JWKS_URL:-}
      GRAGRAPH_FAISS_DIR: /data/faiss
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost:8000/mcp/}
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-http://localhost:8000}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      VLLM_MAX_CONTEXT_CHARS: ${VLLM_MAX_CONTEXT_CHARS:-32000}
      VLLM_MAX_DOCUMENT_CHARS: ${VLLM_MAX_DOCUMENT_CHARS:-6000}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      SECURITY_PPL_THRESHOLD: ${SECURITY_PPL_THRESHOLD:-80}
      SECURITY_MARKER_THRESHOLD: ${SECURITY_MARKER_THRESHOLD:-2}
      RRF_K: ${RRF_K:-60}
      VECTOR_WEIGHT: ${VECTOR_WEIGHT:-0.55}
      GRAPH_WEIGHT: ${GRAPH_WEIGHT:-0.45}
      TOP_K: ${TOP_K:-8}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - graphrag_faiss:/data/faiss
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:2026-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - graphrag_neo4j:/data
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  graphrag_faiss:
  graphrag_neo4j:
