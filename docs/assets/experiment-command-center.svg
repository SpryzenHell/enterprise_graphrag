<text x="1110" y="390" fill="#2563eb" font-family="DejaVu Sans,Arial" font-size="12">Recall@5 = 1.00 across all 11 weights</text>
<text x="1110" y="442" fill="#f97316" font-family="DejaVu Sans,Arial" font-size="12">MRR = 1.00 across all 11 weights</text>
