<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#f4f7fb"/>
<text x="70" y="68" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="34" font-weight="700">Fixture Experiment Command Center</text>
<text x="70" y="104" fill="#64748b" font-family="DejaVu Sans,Arial" font-size="18">Checked-in corpus • 5 documents • 2 tenants • 4 labeled questions • deterministic CI</text>

