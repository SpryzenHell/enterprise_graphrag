<polygon points="530,330 518,318 532,313" fill="#94a3b8"/>
<line x1="735" y1="188" x2="790" y2="225" stroke="#94a3b8" stroke-width="4"/>
<polygon points="790,225 774,217 783,232" fill="#94a3b8"/>
<line x1="735" y1="335" x2="790" y2="295" stroke="#94a3b8" stroke-width="4"/>
<polygon points="790,295 773,298 782,311" fill="#94a3b8"/>
<line x1="995" y1="260" x2="1045" y2="260" stroke="#94a3b8" stroke-width="4"/>
<polygon points="1045,260 1030,252 1030,268" fill="#94a3b8"/>
<line x1="1250" y1="250" x2="1280" y2="210" stroke="#94a3b8" stroke-width="4"/>
<polygon points="1280,210 1264,216 1275,226" fill="#94a3b8"/>
<line x1="1360" y1="270" x2="1360" y2="310" stroke="#94a3b8" stroke-width="4"/>
<polygon points="1360,310 1352,295 1368,295" fill="#94a3b8"/>

<rect x="70" y="500" width="1370" height="235" rx="22" fill="#ffffff" stroke="#d5deea"/>
<text x="98" y="540" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="19" font-weight="700">Tenant boundary is carried through the whole path</text>
<text x="98" y="580" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">• JWT supplies tenant_id → vector and graph searches use that tenant → fused hits are checked again → only authorized evidence reaches the answer model.</text>
<text x="98" y="616" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">• Each ingested document also has a tenant-local doc_id. Replacing a doc_id updates the vector index and graph relationships.</text>
<text x="98" y="652" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">• FAISS artifacts use an index, metadata and manifest. Missing or mismatched files cause a failed read instead of partial use.</text>
<text x="98" y="688" fill="#64748b" font-family="DejaVu Sans,Arial" font-size="13">This is the application data path, not a claim about a particular production model or infrastructure size.</text>
</svg>