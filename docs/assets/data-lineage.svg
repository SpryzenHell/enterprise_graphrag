<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<rect width="1500" height="820" fill="#f8fafc"/>
<text x="60" y="65" fill="#0f172a" font-family="DejaVu Sans,Arial" font-size="34" font-weight="700">GraphRAG Data Lineage</text>
<text x="60" y="100" fill="#64748b" font-family="DejaVu Sans,Arial" font-size="17">One document follows separate vector and graph paths, then joins at weighted RRF and security review.</text>



<rect x="70" y="170" width="176" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="92" y="200" fill="#1e3a8a" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">1 • CORPUS</text>
<text x="92" y="229" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">enterprise_data/</text>
<text x="92" y="251" fill="#64748b" font-family="DejaVu Sans Mono,monospace" font-size="11">corpus.jsonl</text>

<rect x="300" y="170" width="176" height="105" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="322" y="200" fill="#166534" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">2 • VALIDATE</text>
<text x="322" y="229" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">tenant</text>
<text x="322" y="251" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">doc_id / text / title</text>

<rect x="530" y="135" width="205" height="105" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="552" y="165" fill="#6b21a8" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">3A • VECTOR PATH</text>
<text x="552" y="194" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">OpenAI-style embedder</text>
<text x="552" y="216" fill="#64748b" font-family="DejaVu Sans Mono,monospace" font-size="11">normalized float vector</text>

<rect x="530" y="280" width="205" height="105" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="552" y="310" fill="#9d174d" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">3B • GRAPH PATH</text>
<text x="552" y="339" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">entity extraction</text>
<text x="552" y="361" fill="#64748b" font-family="DejaVu Sans Mono,monospace" font-size="11">doc → entity relationships</text>

<rect x="790" y="190" width="205" height="140" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="812" y="222" fill="#9a3412" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">4 • RETRIEVE</text>
<text x="812" y="252" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">FAISS HNSW search</text>
<text x="812" y="276" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">Graph lexical search</text>
<text x="812" y="304" fill="#64748b" font-family="DejaVu Sans Mono,monospace" font-size="11">top-K candidate sets</text>

<rect x="1045" y="190" width="205" height="140" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="1067" y="222" fill="#075985" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">5 • FUSE</text>
<text x="1067" y="252" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">weighted RRF</text>
<text x="1067" y="276" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">vector 0.55</text>
<text x="1067" y="298" fill="#334155" font-family="DejaVu Sans,Arial" font-size="14">graph 0.45 • k=60</text>

<rect x="1280" y="150" width="160" height="120" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1300" y="182" fill="#047857" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">6 • SECURE</text>
<text x="1300" y="210" fill="#334155" font-family="DejaVu Sans,Arial" font-size="13">tenant check</text>
<text x="1300" y="232" fill="#334155" font-family="DejaVu Sans,Arial" font-size="13">prompt markers</text>
<text x="1300" y="254" fill="#334155" font-family="DejaVu Sans,Arial" font-size="13">optional PPL</text>

<rect x="1280" y="310" width="160" height="120" rx="20" fill="#111827" stroke="#475569" stroke-width="2"/>
<text x="1300" y="342" fill="#93c5fd" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">7 • ANSWER</text>
<text x="1300" y="370" fill="#e2e8f0" font-family="DejaVu Sans,Arial" font-size="13">extractive or</text>
<text x="1300" y="392" fill="#e2e8f0" font-family="DejaVu Sans,Arial" font-size="13">vLLM answer</text>
<text x="1300" y="414" fill="#94a3b8" font-family="DejaVu Sans Mono,monospace" font-size="10">citations + trace</text>

<!-- connectors -->
