<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="70" y="68" fill="#111827" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700">Security and tenant checks</text>
  <text x="70" y="104" fill="#475569" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">Results from the checked-in five-document fixture</text>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="70" y="160" width="500" height="190" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="105" y="205" fill="#065F46" font-size="26" font-weight="700">Injection case</text>
    <text x="105" y="250" fill="#064E3B" font-size="22">Candidate: acme-injected</text>
    <text x="105" y="292" fill="#064E3B" font-size="22">Markers: 3</text>
    <text x="105" y="332" fill="#047857" font-size="24" font-weight="700">Blocked before answer generation</text>
    <rect x="630" y="160" width="500" height="190" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="665" y="205" fill="#1E3A8A" font-size="26" font-weight="700">Tenant isolation</text>
    <text x="665" y="250" fill="#1E3A8A" font-size="22">Canonical queries: 4</text>
    <text x="665" y="292" fill="#1E3A8A" font-size="22">Cross-tenant leaks: 0</text>
    <text x="665" y="332" fill="#1D4ED8" font-size="24" font-weight="700">All four cases passed</text>
    <rect x="70" y="390" width="1060" height="190" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="105" y="438" fill="#334155" font-size="24" font-weight="700">Expected security path</text>
    <text x="105" y="485" fill="#475569" font-size="21">query → candidate retrieval → security check → blocked or allowed context</text>
    <text x="105" y="530" fill="#475569" font-size="21">No tenant ID is accepted from the query or MCP tool arguments.</text>
  </g>
